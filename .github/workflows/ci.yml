# Läuft bei jedem Push und Pull Request: Typen prüfen und Tests ausführen.
# Vercel baut unabhängig davon — dieser Lauf ist die zweite Meinung, die
# einen kaputten Stand sichtbar macht, bevor jemand ihn live bemerkt.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # prisma generate braucht keine Datenbank — nur das Schema.
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      # Bekannte Schwachstellen in Abhängigkeiten: ab "high" schlägt der Lauf
      # fehl. Vercel deployt trotzdem — das rote Kreuz hier ist das Signal,
      # zeitnah `npm audit fix` bzw. ein Update einzuspielen.
      - run: npm audit --audit-level=high
